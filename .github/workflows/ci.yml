name: CI

on:
  push:
    branches: [akukhar-develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn size
      - run: yarn lint:ext
      - name: source archive rebuilds the extension
        run: |
          root=$PWD
          staged=$(mktemp -d)
          yarn dist
          unzip -q dist/source.zip -d "$staged"
          cd "$staged"
          yarn install --frozen-lockfile
          yarn build
          diff -r dist/chrome "$root/dist/chrome"
